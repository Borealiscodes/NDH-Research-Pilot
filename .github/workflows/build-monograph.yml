name: Build Volume I Monograph PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'research/monographs/volume1/**'
      - '.github/workflows/build-monograph.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'research/monographs/volume1/**'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            lmodern

      - name: Compile Volume I PDF via Pandoc
        working-directory: research/monographs/volume1
        run: |
          pandoc volume1.md appendices/*.md \
            --citeproc \
            --bibliography=references.bib \
            --pdf-engine=xelatex \
            --toc \
            --number-sections \
            -V geometry:margin=1in \
            -o volume1.pdf

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Volume-I-Geometric-Operator-Theory
          path: research/monographs/volume1/volume1.pdf
          retention-days: 90
